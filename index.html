<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilo.css">
    <!-- JS -->
    <script type="module" defer src="index.js"></script>
    <script type="module" defer src="main.js"></script>
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Tienda Online</h1>
    </header>
    <main>
        <!DOCTYPE html>
        <html lang="es">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mi Simulador</title>
        </head>

        <body>
            <main class="simulador">
                <h1>Mi Simulador</h1>
                <h3>Agregar producto nuevo</h3>
                <section class="formulario" id="formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Nombre del producto">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" placeholder="Precio">
                    <label for="categoria">Categoria:</label>
                    <input type="text" id="categoria" placeholder="Categoria del producto">
                    <label for="marca">Marca:</label>
                    <input type="text" id="marca" placeholder="Marca del producto">
                    <button id="agregar"> Agregar </button>
                    <button id="buscar"> Buscar </button>
                </section>
                <hr>
                <section class="productos">
                    <h2>Productos</h2>
                    <div id="listaProductos" class="contenedor-productos">
                        <!-- Aca se cargar las CARDS -->
                    </div>
                </section>

                <section class="carrito">
                    <h2>Carrito de compras</h2>
                    <div id="carritoProductos" class="contenedor-carrito">
                        <!-- Aca se cargar las CARDS del carrito -->
                    </div>
                    <div >
                        <p>Total con IVA:  <span id="totalCarrito"></span></p>
                    </div>
                </section>
            </main>



            <footer></footer>
        </body>

        </html>
