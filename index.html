<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilo.css">

    <title>Tienda Online - Simulador</title>

</head>

<body>
    <header class="header">
        <h1>Tienda Online</h1>
        <p>Simulador de productos y carrito de compras</p>
    </header>

    <main class="simulador">

        <section class="panel formulario-panel">

            <h2>Agregar producto</h2>

            <form id="formulario">

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Monitor" required>
                </div>

                <div class="campo">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" placeholder="Ej: 75000" min="1" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoría</label>
                    <input type="text" id="categoria" placeholder="Ej: Periféricos" required>
                </div>

                <div class="campo">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" placeholder="Ej: Asus" required>
                </div>

                <button type="submit" class="btn btn-principal" id="agregar">
                    Agregar producto
                </button>

            </form>

            <p id="mensaje" class="mensaje"></p>

        </section>


        <section class="panel">

            <div class="seccion-header">

                <div>
                    <h2>Productos</h2>
                    <p>Buscá un producto por nombre.</p>
                </div>

                <div class="buscador">

                    <input type="search" id="busqueda" placeholder="Buscar producto..." autocomplete="off">

                    <button type="button" id="limpiarBusqueda" class="btn btn-secundario">
                        Mostrar todos
                    </button>

                </div>

            </div>

            <div id="listaProductos" class="contenedor-productos"></div>

        </section>


        <section class="panel carrito-panel">

            <div class="seccion-header">

                <div>
                    <h2>Carrito de compras</h2>
                    <p>Productos seleccionados.</p>
                </div>

                <div class="total">
                    <span>Total con IVA</span>
                    <strong id="totalCarrito">$0</strong>
                </div>

            </div>

            <div id="carritoProductos" class="contenedor-carrito"></div>

        </section>

    </main>


    <footer class="footer">
        <p>Simulador JavaScript - CoderHouse</p>
    </footer>


    <script type="module" src="./index.js"></script>

</body>

</html>
